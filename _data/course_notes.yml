- name: "AI Infrastructure"
  description: "Engineering foundations of large-model systems: hardware, communication, training, and inference."
  items:
    - title: "AI Infra M0 — Foundations"
      description: "Python, mathematical foundations, Transformers, GPUs, and collective communication."
      pdf: "/files/course-notes/ai-infra-m0-foundations.pdf"
    - title: "AI Infra M1 — CUDA Programming and Kernel Optimization"
      description: "CUDA execution model, memory hierarchy, operator implementation, and performance optimization."
      pdf: "/files/course-notes/ai-infra-m1-cuda-kernel-optimization.pdf"
    - title: "AI Infra M2 — Distributed Training"
      description: "Data, tensor, and pipeline parallelism; collective communication, ZeRO, and training systems."
      pdf: "/files/course-notes/ai-infra-m2-distributed-training.pdf"
    - title: "AI Infra M3 — Inference Optimization"
      description: "KV caching, batching, quantization, speculative decoding, and inference serving."
      pdf: "/files/course-notes/ai-infra-m3-inference-optimization.pdf"
    - title: "DeepSeek-V4.1-Flash — Technical Report Analysis"
      description: "A modular technical analysis based on the official report, model card, and kernels."
      pdf: "/files/course-notes/deepseek-v4-1-flash-technical-report-analysis.pdf"

- name: "Machine Learning and AI"
  description: "Machine learning, reinforcement learning, language models, vision, and optimization."
  items:
    - title: "Stanford CS229 — Machine Learning"
      description: "Supervised and unsupervised learning, probabilistic models, and learning theory."
      pdf: "/files/course-notes/stanford-cs229-machine-learning.pdf"
    - title: "Stanford CS234 — Reinforcement Learning"
      description: "MDPs, value iteration, policy gradients, exploration, and deep reinforcement learning."
      pdf: "/files/course-notes/stanford-cs234-reinforcement-learning.pdf"
    - title: "Stanford CS336 — Language Modeling from Scratch"
      description: "The full language-model stack, from data and Transformers to training and evaluation."
      pdf: "/files/course-notes/stanford-cs336-language-modeling.pdf"
    - title: "Stanford CS224n — Natural Language Processing"
      description: "Word representations, sequence models, attention, pretraining, and NLP applications."
      pdf: "/files/course-notes/stanford-cs224n-natural-language-processing.pdf"
    - title: "Stanford CS231n — Computer Vision"
      description: "Convolutional networks, visual recognition, detection and segmentation, and generative models."
      pdf: "/files/course-notes/stanford-cs231n-computer-vision.pdf"
    - title: "UC Berkeley CS285 — Deep Reinforcement Learning"
      description: "Deep RL, model-based RL, offline RL, and multitask learning."
      pdf: "/files/course-notes/ucb-cs285-deep-reinforcement-learning.pdf"
    - title: "Stanford EE364a — Convex Optimization"
      description: "Convex sets, convex functions, duality, optimality conditions, and applied modeling."
      pdf: "/files/course-notes/stanford-ee364a-convex-optimization.pdf"

- name: "Systems, Architecture, and Networks"
  description: "Computer systems, architecture, operating systems, databases, networks, and security."
  items:
    - title: "CMU 15-213 — CSAPP: Computer Systems"
      description: "Program representation, processors, memory hierarchy, linking, exceptional control flow, and concurrency."
      pdf: "/files/course-notes/cmu-15-213-csapp.pdf"
    - title: "CMU 15-418/15-618 — Parallel Computer Architecture"
      description: "Parallel hardware, memory consistency, performance models, and parallel programming."
      pdf: "/files/course-notes/cmu-15-418-parallel-architecture.pdf"
    - title: "Stanford CS149 — Parallel Computing"
      description: "Parallel algorithms, GPUs, heterogeneous computing, and performance analysis."
      pdf: "/files/course-notes/stanford-cs149-parallel-computing.pdf"
    - title: "CMU 15-445/645 — Database Systems"
      description: "Storage, indexing, query execution, concurrency control, and recovery."
      pdf: "/files/course-notes/cmu-15-445-database-systems.pdf"
    - title: "CS111 — Operating Systems"
      description: "Processes and threads, synchronization, virtual memory, file systems, and OS design."
      pdf: "/files/course-notes/cs111-operating-systems.pdf"
    - title: "UC Berkeley CS162 — Operating Systems"
      description: "Systems programming, processes, scheduling, memory, file systems, and concurrency."
      pdf: "/files/course-notes/ucb-cs162-operating-systems.pdf"
    - title: "UC Berkeley CS61C — Computer Architecture"
      description: "RISC-V, digital logic, pipelining, caches, and the memory hierarchy."
      pdf: "/files/course-notes/ucb-cs61c-computer-architecture.pdf"
    - title: "UIUC CS425 — Distributed Systems"
      description: "Replication, consistency, consensus, distributed transactions, and fault tolerance."
      pdf: "/files/course-notes/uiuc-cs425-distributed-systems.pdf"
    - title: "UIUC ECE220 — Computer Systems and Programming"
      description: "C programming, pointers, memory, assembly, and system interfaces."
      pdf: "/files/course-notes/uiuc-ece220-computer-systems.pdf"
    - title: "UIUC ECE408 — Applied Parallel Programming"
      description: "CUDA, parallel patterns, reductions and scans, tiling, and performance optimization."
      pdf: "/files/course-notes/uiuc-ece408-applied-parallel-programming.pdf"
    - title: "Stanford CS144 — Computer Networking"
      description: "Layered networks, TCP/IP, reliable transport, routing, and application protocols."
      pdf: "/files/course-notes/stanford-cs144-computer-networking.pdf"
    - title: "UC Berkeley CS161 — Computer Security"
      description: "Memory safety, cryptography, network security, and system security."
      pdf: "/files/course-notes/ucb-cs161-computer-security.pdf"
    - title: "MIT 6.172 — Performance Engineering"
      description: "Performance modeling, cache optimization, parallelization, compilers, and engineering tuning."
      pdf: "/files/course-notes/mit-6-172-performance-engineering.pdf"

- name: "Programming and Software"
  description: "Programming abstractions, modern C++, and software construction."
  items:
    - title: "Stanford CS106B — Programming Abstractions"
      description: "Recursion, data structures, algorithm design, and C++ abstraction."
      pdf: "/files/course-notes/cs106b-programming-abstractions.pdf"
    - title: "Stanford CS106L — Modern C++"
      description: "Modern C++ types, the STL, templates, RAII, and move semantics."
      pdf: "/files/course-notes/cs106l-modern-cpp.pdf"
    - title: "MIT 6.031 — Software Construction"
      description: "Specifications, testing, abstract data types, concurrency, and software design."
      pdf: "/files/course-notes/mit-6-031-software-construction.pdf"

- name: "Algorithms, Theory, and Mathematics"
  description: "Algorithms, theory of computation, discrete mathematics, and engineering mathematics foundations."
  items:
    - title: "MIT 6.006 — Introduction to Algorithms"
      description: "Data structures, graph algorithms, dynamic programming, and complexity."
      pdf: "/files/course-notes/mit-6-006-algorithms.pdf"
    - title: "UC Berkeley CS170 — Efficient Algorithms"
      description: "Algorithm design, NP-completeness, approximation, and randomized algorithms."
      pdf: "/files/course-notes/ucb-cs170-algorithms.pdf"
    - title: "MIT 18.03 — Differential Equations"
      description: "Ordinary differential equations, linear systems, Fourier methods, and Laplace transforms."
      pdf: "/files/course-notes/mit-18-03-differential-equations.pdf"
    - title: "MIT 18.05 — Probability and Statistics"
      description: "Probability, random variables, estimation, hypothesis testing, and Bayesian methods."
      pdf: "/files/course-notes/mit-18-05-probability-statistics.pdf"
    - title: "MIT 18.06 — Linear Algebra"
      description: "Linear systems, vector spaces, eigenvalues, SVD, and applications."
      pdf: "/files/course-notes/mit-18-06-linear-algebra.pdf"
    - title: "MIT 18.100A — Real Analysis"
      description: "Limits, continuity, calculus, series, and the foundations of metric spaces."
      pdf: "/files/course-notes/mit-18-100a-real-analysis.pdf"
    - title: "MIT 18.335 — Numerical Methods"
      description: "Numerical linear algebra, stability, matrix factorizations, and iterative methods."
      pdf: "/files/course-notes/mit-18-335-numerical-methods.pdf"
    - title: "MIT 18.404 — Theory of Computation"
      description: "Automata, computability, complexity, and reductions."
      pdf: "/files/course-notes/mit-18-404-theory-of-computation.pdf"
    - title: "UC Berkeley CS70 — Discrete Mathematics and Probability"
      description: "Proofs, combinatorics, discrete probability, expectation, and stochastic processes."
      pdf: "/files/course-notes/ucb-cs70-discrete-math-probability.pdf"
